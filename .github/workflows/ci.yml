name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Physics, API & Schema Tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install OpenGL runtime libraries for CAD/mesh dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libxrender1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Run fast physics, mechatronics, API & DB test suite
        run: |
          pytest -v \
            backend/tests/test_physics.py \
            backend/tests/test_mechatronics_v4.py \
            backend/tests/test_fabri_arm_5.py \
            backend/tests/test_universal_arms_v5.py \
            backend/tests/test_wave2_fixes_v6.py \
            backend/tests/test_wave3_v7.py \
            backend/tests/test_firmware_and_db.py

  frontend-build:
    name: Frontend Typecheck & Production Build (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck & Vite build
        run: npx tsc --noEmit && npm run build
